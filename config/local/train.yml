model:
  name: Qwen/Qwen2.5-Coder-0.5B-Instruct

quantization:
  enabled: true
  load_in_4bit: true
  load_in_8bit: false
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  num_epochs: 2
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  deepspeed: ./config/local/ds_config.json

data:
  path: ./data/processed
  max_length: 4096
  max_train_samples: 20
  max_val_samples: 5

checkpointing:
  output_dir: ./checkpoints
  save_steps: 500
  save_total_limit: 3
  resume_from: null

logging:
  wandb_project: text2sql
  wandb_run_name: null
  log_steps: 2

seed: 42