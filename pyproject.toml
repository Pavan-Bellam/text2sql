[project]
name = "text2sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.0",
    "boto3>=1.42.22",
    "datasets>=4.4.2",
    "deepspeed>=0.18.3",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "peft>=0.18.0",
    "polars>=1.36.1",
    "pydantic>=2.12.5",
    "torch==2.9.0",
    "transformers>=4.57.3",
    "trl>=0.26.2",
    "typer>=0.21.0",
    "wandb>=0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]
serve = [
    "vllm==0.13.0",
    "ray[serve]",
]
distributed = [
    "deepspeed"
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
